<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>OI 尖塔 II</title>

<style>
/* 布局：顶部 HUD，中间纵向爬塔地图（底部起点，顶部 Boss），联机时右侧为房间面板 */
:root{
  --bg:#0a0f14; --panel:#111922; --panel2:#17212c; --line:#233140; --fg:#d9e3ee; --dim:#8196ab;
  --c-monster:#c6d83a; --c-elite:#22d3ee; --c-boss:#4c7dff; --c-unknown:#a9b6c4;
  --c-rest:#ff8a4c; --c-shop:#e879f9; --c-treasure:#f5d76e;
  --yellow:#f2c230; --green:#3fb950; --cyan:#22d3ee; --blue:#4c7dff;
  --bad:#ff6b6b; --good:#4ade80;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);
  background-image:linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px);
  background-size:32px 32px}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:.45em .9em;cursor:pointer}
button:hover:not(:disabled){border-color:var(--dim);background:#1d2a38}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:#16424a;border-color:#2a7f8c}
button.primary:hover:not(:disabled){background:#1c5560}
button.danger{border-color:#7a3a3a;background:#2a1717}
input,select{font:inherit;color:var(--fg);background:#0c131a;border:1px solid var(--line);border-radius:6px;padding:.4em .6em;min-width:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.wrap{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px))}

/* 菜单 */
.menu{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:20px;max-width:760px;margin:0 auto;padding:40px 24px}
.logo{font-size:clamp(40px,9vw,84px);font-weight:700;letter-spacing:.02em;line-height:1}
.logo span{color:var(--cyan);font-family:var(--mono)}
.tagline{color:var(--dim);margin:0;font-size:16px}
.menu-btns{display:flex;flex-wrap:wrap;gap:10px}
.menu-btns button{padding:.7em 1.4em;font-size:15px}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}

/* 标签 */
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.05em .6em;border-radius:99px;border:1px solid currentColor;font-size:12px;white-space:nowrap}
.k-monster{color:var(--c-monster)} .k-elite{color:var(--c-elite)} .k-boss{color:var(--c-boss)}
.k-unknown{color:var(--c-unknown)} .k-rest{color:var(--c-rest)} .k-shop{color:var(--c-shop)} .k-treasure{color:var(--c-treasure)}
.p-yellow{color:var(--yellow)} .p-green{color:var(--green)} .p-cyan{color:var(--cyan)} .p-blue{color:var(--blue)} .p-mix{color:#6fc4e8}

/* 难度选择 */
.sel{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dcard{text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.dcard.on{border-color:var(--cyan);background:#14333b}
.dcard.lock{opacity:.45}
.dots{display:flex;gap:4px}
.dots i{width:18px;height:6px;border-radius:2px;background:#26323f}
.dots i.f{background:var(--cyan)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.modlist{margin:8px 0 0;padding-left:1.2em}
.modlist li{margin:2px 0;color:var(--dim)}
.modlist li.new{color:var(--fg);font-weight:500}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.hud .grp{display:flex;align-items:center;gap:8px;min-width:0}
.hpbar{width:150px;height:10px;background:#26323f;border-radius:5px;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#d94c4c,#ff8a6b)}
.relics{display:flex;flex-wrap:wrap;gap:4px}
.relic{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;background:var(--panel2);font-weight:700;cursor:help}
.relic.r-uncommon{border-color:#3b6ea8}.relic.r-rare{border-color:#c9a13b}
.pots{display:flex;gap:6px}
.pot{min-width:64px;font-size:12px;padding:.25em .5em;border-radius:6px;border:1px solid #2f5f6b;background:#102a30}
.pot.empty{border-style:dashed;background:transparent;color:var(--dim);cursor:default}
.spacer{flex:1}

/* 游戏布局 */
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:12px;align-items:start}
.game.solo{grid-template-columns:minmax(0,1fr)}
#mapwrap{height:calc(100vh - 200px);min-height:420px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#mapwrap svg{display:block;width:100%;max-width:700px;margin:0 auto;height:auto}
.node{cursor:default}
.node circle.ring{fill:#0e151c;stroke-width:2.5}
.node text{font-weight:700;font-size:15px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.visited{opacity:.35}
.node.avail{cursor:pointer}
.node.avail circle.ring{animation:pulse 1.4s ease-in-out infinite;fill:#15222d}
.node.cur circle.ring{fill:var(--fg)}
.node.cur text{fill:#0a0f14!important}
.node.far{opacity:.7}
@keyframes pulse{50%{stroke-width:5}}
@media (prefers-reduced-motion:reduce){.node.avail circle.ring{animation:none;stroke-width:4}}
.edge{stroke:#2b3b4b;stroke-width:2;fill:none;stroke-dasharray:3 5}
.edge.on{stroke:var(--fg);stroke-dasharray:none;opacity:.8}
.mapnote{padding:8px 14px;color:var(--dim);font-size:12px;display:flex;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);background:var(--panel)}

/* 弹层 */
.modal-bg{position:fixed;inset:0;background:rgba(4,8,12,.78);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid #2d4156;border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:22px}
.timer{font-family:var(--mono);font-size:clamp(48px,14vw,84px);font-weight:700;line-height:1;text-align:center;letter-spacing:.02em}
.timer.warn{color:var(--c-rest)} .timer.crit{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;padding:.6em .9em}
.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:4px}
.item.sold{opacity:.4}
.hint{border-left:3px solid var(--cyan);padding:4px 10px;background:#0f1d24;color:#bfe9f0}
.msg{padding:8px 12px;border-radius:8px;background:#0f1d24;border:1px solid #1f3b45}
.bar{height:6px;border-radius:3px;background:#26323f;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan)}

/* 侧栏 */
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 100px);min-height:300px}
.side h3{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.plist{padding:8px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:46%}
.pl{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel2);display:flex;flex-direction:column;gap:3px;font-size:12px}
.pl.me{border-color:#2a7f8c}
.pl .top{display:flex;justify-content:space-between;gap:6px}
.chat{flex:1;min-height:120px;overflow:auto;padding:8px 12px;border-top:1px solid var(--line);font-size:12px}
.chat div{margin:2px 0;word-break:break-word}
.chatin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.chatin input{flex:1}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16424a;border:1px solid #2a7f8c;padding:8px 16px;border-radius:8px;z-index:50;max-width:90vw}
@media (max-width:900px){
  .game{grid-template-columns:minmax(0,1fr)}
  .sel,.lobby{grid-template-columns:minmax(0,1fr)}
  #mapwrap{height:70vh}
  .side{max-height:none}
}
@media (max-width:480px){.dgrid{grid-template-columns:minmax(0,1fr)}.shopgrid{grid-template-columns:minmax(0,1fr)}.hpbar{width:100px}}

<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   一、纯逻辑：随机数、地图、数据定义（无 DOM 依赖）
   ===================================================================== */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rngFor(seed,key){return mulberry32(hashStr(seed+'|'+key))}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));

const W=7, ROWS=15;           // 7 列，15 层，第 16 层为 Boss
const SPECIAL=['elite','rest','shop'];

/* ---------- 难度 ---------- */
const DNAMES=['新手村','入门赛','普及组','提高组','省选前夜','省选','集训队','国家队','IOI','AK 之路'];
const MODS=[
  '基础规则：三个阶段，击败每个阶段的 Boss 才算通关。',
  '精英房间更常出现。',
  '初始最大 HP -10。',
  '战斗失败造成的 HP 损失 +25%。',
  '商店价格 +25%。',
  '休息处回复比例由 30% 降为 20%。',
  '药水栏位 -1。',
  '战斗金币奖励 -25%。',
  'Boss 战失败造成的 HP 损失 +50%；阶段之间只回复 50% HP。',
  '没有初始遗物；未知房间更容易出现坏事件；第三阶段需连续击败两个 Boss。'
];
function P(d){return{
  eliteW:d>=2?0.14:0.09, startMax:80-(d>=3?10:0), failMult:d>=4?1.25:1, shopMult:d>=5?1.25:1,
  restPct:d>=6?0.2:0.3, slots:d>=7?2:3, goldMult:d>=8?0.75:1, bossFailMult:d>=9?1.5:1,
  actHeal:d>=9?0.5:1, noStarter:d>=10, badEvent:d>=10?0.25:0 }}

/* ---------- 地图生成（仿杀戮尖塔：6 条不交叉路径） ---------- */
function genMap(seed,act,diff){
  const r=rngFor(seed,'map'+act);
  const nodes=[];
  for(let i=0;i<=ROWS;i++)nodes.push(new Array(W).fill(null));
  const starts=[];
  for(let p=0;p<6;p++){
    let c;
    if(p<2){do{c=Math.floor(r()*W)}while(p===1&&c===starts[0])}else c=Math.floor(r()*W);
    starts.push(c);
    for(let row=0;row<ROWS;row++){
      if(!nodes[row][c])nodes[row][c]={r:row,c,next:[],type:null};
      if(row===ROWS-1)break;
      const cand=[c-1,c,c+1].filter(x=>x>=0&&x<W);
      for(let i=cand.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]]}
      let nc=c;
      for(const x of cand){
        if(x===c+1){const o=nodes[row][c+1];if(o&&o.next.includes(c))continue}
        if(x===c-1){const o=nodes[row][c-1];if(o&&o.next.includes(c))continue}
        nc=x;break;
      }
      const n=nodes[row][c];
      if(!n.next.includes(nc))n.next.push(nc);
      c=nc;
    }
  }
  // 顶层节点汇入 Boss
  for(let c=0;c<W;c++){const n=nodes[ROWS-1][c];if(n)n.next=[3]}
  nodes[ROWS][3]={r:ROWS,c:3,next:[],type:'boss'};
  // 房间类型
  const pr=P(diff);
  for(let row=0;row<ROWS;row++)for(let c=0;c<W;c++){
    const n=nodes[row][c];if(!n)continue;
    if(row===0){n.type='monster';continue}
    if(row===8){n.type='treasure';continue}
    if(row===ROWS-1){n.type='rest';continue}
    const pool=[['monster',0.45],['unknown',0.22],['elite',pr.eliteW],['rest',0.12],['shop',0.05]].filter(([t])=>{
      if((t==='elite'||t==='rest')&&row<4)return false;
      if(t==='rest'&&row===ROWS-2)return false;
      if(SPECIAL.includes(t)){
        for(let pc=0;pc<W;pc++){
          const p=nodes[row-1][pc];
          if(p&&p.next.includes(c)){
            if(p.type===t)return false;
            for(const sc of p.next){if(sc!==c&&nodes[row][sc]&&nodes[row][sc].type===t)return false}
          }
        }
      }
      return true;
    });
    let tot=0;pool.forEach(x=>tot+=x[1]);
    let v=r()*tot,t='monster';
    for(const x of pool){v-=x[1];if(v<=0){t=x[0];break}}
    n.type=t;
  }
  return {nodes};
}

/* ---------- 题目难度提示 ---------- */
const MONSTER_LV=[['黄 · 偏易','yellow'],['黄 · 偏难','yellow'],['绿 · 偏易','green'],['绿 · 偏难','green']];
const ELITE_LV=[['青 · 偏易','cyan'],['青 · 适中','cyan'],['青 · 偏难','cyan']];
const BOSS_LV=[['难青','cyan'],['难青 ~ 蓝','mix'],['蓝 · 偏易','blue'],['蓝','blue']];
function problemHint(run,kind,node){
  const p=((run.difficulty-1)*3+(run.act-1))/29;
  const jr=rngFor(run.seed,'ph'+run.act+'_'+node.r+'_'+node.c);
  let q=p+(node.r/ROWS-0.5)*0.12+(jr()-0.5)*0.08;
  q=Math.max(0,Math.min(0.999,q));
  if(kind==='monster')return MONSTER_LV[Math.floor(q*4)];
  if(kind==='elite')return ELITE_LV[Math.floor(q*3)];
  return BOSS_LV[Math.floor(Math.max(0,Math.min(0.999,p))*4)];
}
const TOPICS=['数据结构','动态规划','图论','数学 / 数论','字符串','贪心','搜索 / 剪枝','构造','二分 / 三分','计算几何','模拟','博弈论'];
const MONSTER_NAMES=['水题史莱姆','模板题傀儡','贪心小妖','DP 幼苗','字符串蝙蝠','图论蜘蛛','数学幽灵','二分地精','暴力哥布林'];
const ELITE_NAMES=['卡常怪','边界数据','毒瘤构造','反 Hash 数据','大模拟魔像','交互题恶魔'];
const BOSS_NAMES=['暴力杀手 T3','毒瘤数据结构','出题人本人'];
const STAGE_NAMES=['阶段一 · 普及组考场','阶段二 · 提高组考场','阶段三 · NOI 赛场'];

/* ---------- 遗物 ---------- */
const ROOT_BOONS=[
  {id:'vitality',n:'先祖祝福：强健',d:'最大 HP +20，并立即回复 20 HP。',f:()=>{run.maxHp+=20;heal(20)}},
  {id:'wisdom',n:'先祖祝福：洞察',d:'所有战斗时限永久 +5 分钟。',f:()=>{run.rootTime=(run.rootTime||0)+5}},
  {id:'fortune',n:'先祖祝福：丰饶',d:'立即获得 100 金币，并获得一瓶治疗药水。',f:()=>{run.gold+=100;givePotion('heal')}}
];
const RELICS={
  starter:{n:'新手礼包',d:'每场战斗胜利后回复 2 点 HP。',r:'starter',e:{winHeal:2}},
  keyboard:{n:'机械键盘',d:'所有战斗时限 +5 分钟。',r:'common',e:{timeAll:5}},
  thermos:{n:'保温杯',d:'在休息处额外回复 8 点HP。',r:'common',e:{restHeal:8}},
  checker:{n:'对拍器',d:'战斗失败损失的HP -20%。',r:'uncommon',e:{failMult:-0.2}},
  library:{n:'板子库',d:'战斗金币奖励 +50%。',r:'common',e:{goldMult:0.5}},
  rbtree:{n:'红黑树',d:'获得时最大HP +12。',r:'uncommon',e:{maxHp:12}},
  aircon:{n:'空调',d:'精英战时限 +10 分钟。',r:'uncommon',e:{time_elite:10}},
  mystic:{n:'玄学',d:'未知房间更容易出现好事件。',r:'common',e:{goodEvent:0.25}},
  coupon:{n:'优惠券',d:'商店价格 -20%。',r:'common',e:{shopDiscount:0.2}},
  scratch:{n:'草稿纸',d:'战斗胜利后 35% 额外获得一瓶药水。',r:'common',e:{potionDrop:0.35}},
  dual:{n:'双屏',d:'药水栏位 +1。',r:'uncommon',e:{slots:1}},
  maker:{n:'咖啡机',d:'每进入一个新阶段，获得一杯咖啡。',r:'uncommon',e:{actCoffee:1}},
  glasses:{n:'防蓝光眼镜',d:'Boss 战时限 +10 分钟。',r:'uncommon',e:{time_boss:10}},
  amulet:{n:'自动机护符',d:'每个阶段第一次战斗失败不损失HP。',r:'rare',e:{actShield:1}},
  wallet:{n:'钱包',d:'获得时得到 150 金币。',r:'common',e:{gold:150}},
  lucky:{n:'开机自带 AC',d:'战斗开始时额外 +3 分钟，药水栏位 +1。',r:'rare',e:{timeAll:3,slots:1}},
  heart:{n:'红色心形',d:'获得时最大 HP +10。',r:'common',e:{maxHp:10}},
  stopwatch:{n:'老式秒表',d:'所有战斗时限 +3 分钟。',r:'common',e:{timeAll:3}},
  medkit:{n:'急救箱',d:'每次进入新阶段回复 12 HP。',r:'uncommon',e:{actHealFlat:12}},
  calculator:{n:'图形计算器',d:'小怪胜利金币 +30%。',r:'uncommon',e:{monsterGold:0.3}},
  compass:{n:'寻路罗盘',d:'未知事件中更容易遇到有利选项。',r:'rare',e:{goodEvent:0.2}},
  luckycoin:{n:'幸运硬币',d:'每次战斗胜利额外获得 8 金币。',r:'uncommon',e:{winGold:8}},
  bandage:{n:'绷带卷',d:'每次战斗失败后额外回复 5 HP。',r:'rare',e:{failHeal:5}},

  crystal:{n:'思路水晶',d:'Boss 战胜利金币 +25%。',r:'rare',e:{bossGold:0.25}},
  lunchbox:{n:'便当盒',d:'每进入新阶段回复 8 HP。',r:'common',e:{actHealFlat:8}},
  magnet:{n:'金币磁铁',d:'所有战斗金币奖励 +10%。',r:'uncommon',e:{goldMult:0.1}}
};
const RELIC_PRICE={common:140,uncommon:220,rare:320,starter:0};

/* ---------- 药水 ---------- */
const POTIONS={
  coffee:{n:'咖啡',d:'战斗中使用：本场时限 +10 分钟。',w:3,price:55,combat:true},
  espresso:{n:'浓缩咖啡',d:'战斗中使用：本场时限 +20 分钟。',w:1,price:95,combat:true},
  heal:{n:'治疗药水',d:'回复 25 点 HP。',w:3,price:60},
  insure:{n:'保险药水',d:'战斗中使用：本场即使失败也不损失HP。',w:2,price:90,combat:true},

/* ---------- 随机选择 ---------- */
function randPotion(r,allowChosen){
  const ids=Object.keys(POTIONS).filter(k=>allowChosen||POTIONS[k].w>0);
  let tot=0;ids.forEach(k=>tot+=Math.max(POTIONS[k].w,0.01));
  let v=r()*tot;
  for(const k of ids){v-=Math.max(POTIONS[k].w,0.01);if(v<=0)return k}
  return ids[0];
}
function randRelic(r,owned,rarity){
  const rw={common:60,uncommon:32,rare:8};
  let ids=Object.keys(RELICS).filter(k=>RELICS[k].r!=='starter'&&!owned.includes(k));
  if(rarity)ids=ids.filter(k=>RELICS[k].r===rarity);
  if(!ids.length)return null;
  let tot=0;ids.forEach(k=>tot+=rw[RELICS[k].r]);
  let v=r()*tot;
  for(const k of ids){v-=rw[RELICS[k].r];if(v<=0)return k}
  return ids[0];
}
const fmtTime=ms=>{ms=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(ms/60),s=ms%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};

const E=k=>run.relics.reduce((s,id)=>s+(RELICS[id].e[k]||0),0);
const hasRelic=id=>run.relics.includes(id);
const slotCount=()=>P(run.difficulty).slots+E('slots');

/* =====================================================================
   三、爬塔流程
   ===================================================================== */
function newRun(diff,seed){
  const pr=P(diff);
  const r={v:1,seed:String(seed),difficulty:diff,act:1,hp:pr.startMax,maxHp:pr.startMax,gold:99,
    relics:pr.noStarter?[]:['starter'],potions:['coffee'],nextFightMs:0,shield:false,rootPending:true,rootTime:0,actBossWins:0,
    pos:null,visited:{},room:null,map:null,over:false,victory:false,
    stats:{wins:0,fails:0,elites:0,startedAt:Date.now()}};
  return r;
}
function startAct(){
  run.map=genMap(run.seed,run.act,run.difficulty);
  run.pos=null;run.visited={};run.room=null;run.rootPending=true;if(run.act!==3)run.actBossWins=0;
  run.shield=hasRelic('amulet');
  if(E('actCoffee')&&run.potions.length<slotCount())run.potions.push('coffee');
  prog.best[run.difficulty]=Math.max(prog.best[run.difficulty]||0,run.act);saveProg();
  lastMapAct=null;
}
function startRun(diff,seed){
  if(diff>prog.unlocked){toast('该难度尚未解锁');return}
  run=newRun(diff,seed||Math.random().toString(36).slice(2,8));
  startAct();save();view='game';render();
}
function availNodes(){
  if(!run.pos)return run.map.nodes[0].filter(Boolean);
  const n=nodeAt(run.pos.r,run.pos.c);
  return n.next.map(c=>nodeAt(run.pos.r+1,c));
}
function enterNode(r,c){
  if(run.room||run.over||run.victory)return;
  const n=nodeAt(r,c);
  if(!availNodes().includes(n))return;
  let type=n.type;
  const rr=rngFor(run.seed,'room'+nodeKey(n));
  if(type==='unknown'){
    const v=rr();
    type=v<0.22?'monster':v<0.32?'shop':v<0.42?'treasure':'event';
  }
  run.room={node:{r,c},kind:type,phase:'prep'};
  if(type==='monster'||type==='elite'||type==='boss'){
    run.room.name=type==='boss'?BOSS_NAMES[run.act-1]:pick(rr,type==='elite'?ELITE_NAMES:MONSTER_NAMES);
    run.room.topic=pick(rr,TOPICS);
    run.room.hint=problemHint(run,type,n);
    const base={monster:20,elite:40,boss:60}[type];
    const bonus=E('timeAll')+E('time_'+type)+(run.rootTime||0)+run.nextFightMs/60000;
    run.room.combat={limitMs:(base+bonus)*60000,baseMin:base,bonusMin:bonus,extraMs:0,started:false,done:false,
      insured:false,partial:false,lucky:false,hints:[],confirm:false};
    run.nextFightMs=0;
  }else if(type==='shop'){run.room.shop=genShop(rr)}
  else if(type==='treasure'){run.room.phase='open'}
  else if(type==='rest'){run.room.phase='choose'}
  else if(type==='event'){
    const good=0.45+E('goodEvent')-P(run.difficulty).badEvent;
    const pool=EVENTS.filter(e=>rr()<good?e.kind==='good':e.kind==='mixed');
    run.room.event=pick(rr,pool.length?pool:EVENTS).id;
    run.room.phase='choose';
  }
  save();render();
}
function leaveRoom(){
  const n=run.room.node,isBoss=run.room.kind==='boss';
  run.pos={r:n.r,c:n.c};run.visited[n.r+','+n.c]=1;run.room=null;
  if(isBoss){
    if(run.act<3){
      const pr=P(run.difficulty);
      run.hp=Math.min(run.maxHp,run.hp+Math.round((run.maxHp-run.hp)*pr.actHeal)+E('actHealFlat'));
      run.act++;startAct();toast('进入 '+STAGE_NAMES[run.act-1]);
    }else{
      run.victory=true;
      prog.cleared[run.difficulty]=true;
      if(run.difficulty<10)prog.unlocked=Math.max(prog.unlocked,run.difficulty+1);
      saveProg();
    }
  }
  save();render();
}
function gainRelic(id){
  if(!id||run.relics.includes(id))return;
  run.relics.push(id);
  const e=RELICS[id].e;
  if(e.maxHp){run.maxHp+=e.maxHp;run.hp+=e.maxHp}
  if(e.gold)run.gold+=e.gold;
  if(e.actShield)run.shield=true;
}
function addPotion(id){if(run.potions.length>=slotCount())return false;run.potions.push(id);return true}
function givePotion(id){
  if(addPotion(id))return '获得药水：'+POTIONS[id].n+'。';
  run.gold+=30;return '药水栏已满，换成了 30 金币。';
}
function damage(base,boss){
  const pr=P(run.difficulty);
  const d=base*(1+0.15*(run.act-1))*pr.failMult*(boss?pr.bossFailMult:1)*Math.max(0.3,1+E('failMult'));
  return Math.round(d);
}
function heal(n){const b=run.hp;run.hp=Math.min(run.maxHp,run.hp+n);return run.hp-b}

/* ---------- 战斗 ---------- */
const cb=()=>run&&run.room&&run.room.combat;
const remainingMs=c=>c.limitMs+c.extraMs-(Date.now()-c.startAt);
function chooseRoot(i){
  if(!run.rootPending)return;
  const boon=ROOT_BOONS[i];if(!boon)return;
  boon.f();run.rootPending=false;save();render();
}
function startCombat(){const c=cb();c.started=true;c.startAt=Date.now();c.penaltyAt=0;run.room.phase='fight';save();render()}
function winCombat(){
  const rm=run.room,c=rm.combat,pr=P(run.difficulty);
  c.done=true;rm.phase='won';run.stats.wins++;
  if(rm.kind==='elite')run.stats.elites++;
  const rr=rngFor(run.seed,'rw'+nodeKey(rm.node));
  let g=rm.kind==='boss'?ri(rr,55,75):rm.kind==='elite'?ri(rr,28,42):ri(rr,14,24);
  g+=E('winGold');if(rm.kind==='monster')g=Math.round(g*(1+E('monsterGold')));
  g=Math.round(g*pr.goldMult*(1+E('goldMult'))*(c.lucky?2:1));
  run.gold+=g;
  const h=E('winHeal');if(h)heal(h);
  const rw={gold:g,heal:h,potion:null,relic:null,choices:null};
  if(rr()<(rm.kind==='monster'?0.25:0.5)+E('potionDrop'))rw.potion=randPotion(rr);
  if(rm.kind==='elite')rw.relic=randRelic(rr,run.relics);
  if(rm.kind==='boss'){
    const ch=[];let tmp=run.relics.slice();
    for(let i=0;i<3;i++){const x=randRelic(rr,tmp,i===2?'rare':null);if(x){ch.push(x);tmp.push(x)}}
    rw.choices=ch;
  }
  rm.rewards=rw;save();render();
}
function failCombat(reason){
  const rm=run.room,c=rm.combat;
  c.done=true;c.reason=reason;run.stats.fails++;
  let d=damage({monster:12,elite:22,boss:35}[rm.kind],rm.kind==='boss'),note='';
  if(c.insured){d=0;note='保险药水生效。'}
  else if(run.shield){run.shield=false;d=0;note='自动机护符挡下了这次失败。'}
  else if(c.partial){d=Math.round(d/2);note='暴力分药水生效，损失减半。'}
  run.hp=Math.max(0,run.hp-d);if(E('failHeal'))heal(E('failHeal'));rm.lost=d;rm.note=note;rm.phase='lost';
  if(run.hp<=0){run.over=true}
  save();render();
}
function retryBoss(){
  const rm=run.room,c=rm.combat;
  rm.combat={limitMs:c.limitMs,baseMin:c.baseMin,bonusMin:c.bonusMin,extraMs:0,started:false,done:false,insured:false,partial:false,lucky:false,hints:[],confirm:false};
  rm.phase='prep';rm.lost=0;save();render();

function usePotion(i){
  const id=run.potions[i];if(!id)return;
  const def=POTIONS[id],c=cb();
  if(def.combat&&!(c&&c.started&&!c.done)){toast('这瓶药水只能在战斗计时中使用');return}
  let msg='';

  else if(id==='heal'){msg='回复 '+heal(25)+' 点HP'}

  else if(id==='partial'){c.partial=true;msg='本场失败只损失一半HP'}
  else if(id==='lucky'){c.lucky=true;msg='本场金币翻倍'}
  else if(id==='inspire'){
    const left=INSPIRE.filter(h=>!c.hints.includes(h));
    const h=pick(Math.random,left.length?left:INSPIRE);c.hints.push(h);msg='获得一条提示'
  }
  else if(id==='chosen'){const x=randRelic(Math.random,run.relics);if(x){gainRelic(x);msg='获得遗物：'+RELICS[x].n}else msg='已拥有全部遗物'}

}

/* ---------- 商店 ---------- */
function genShop(rr){
  const pr=P(run.difficulty);
  const f=(1-E('shopDiscount'))*pr.shopMult;
  const items=[];let tmp=run.relics.slice();
  for(let i=0;i<3;i++){
    const id=randRelic(rr,tmp,i===2?(rr()<0.5?'uncommon':null):null)||randRelic(rr,tmp);
    if(id){tmp.push(id);items.push({t:'relic',id,price:Math.round(RELIC_PRICE[RELICS[id].r]*f*(0.9+rr()*0.2))})}
  }
  for(let i=0;i<3;i++){const id=i===2&&rr()<0.2?'chosen':randPotion(rr);items.push({t:'potion',id,price:Math.round(POTIONS[id].price*f*(0.9+rr()*0.2))})}
  items.push({t:'heal',price:Math.round(60*f)});
  items.push({t:'maxhp',price:Math.round(110*f)});
  return {items};
}
function buy(i){
  const it=run.room.shop.items[i];
  if(it.sold||run.gold<it.price)return;
  if(it.t==='potion'&&run.potions.length>=slotCount()){toast('药水栏已满');return}
  run.gold-=it.price;it.sold=true;
  if(it.t==='relic')gainRelic(it.id);
  else if(it.t==='potion')addPotion(it.id);
  else if(it.t==='heal')heal(20);
  else if(it.t==='maxhp'){run.maxHp+=6;run.hp+=6}
  save();render();
}

function eventChoose(i){

  const rr=rngFor(run.seed,'ev'+nodeKey(rm.node)+'_'+i);
  const opts=ev.dyn?ev.dyn(rngFor(run.seed,'evd'+nodeKey(rm.node))):ev.opts;
  const o=opts[i];if(o.need&&run.gold<o.need)return;
  rm.result=o.f(rr);rm.phase='result';
  if(run.hp<=0)run.over=true;
  save();render();

function claim(what,idx){
  const rw=run.room.rewards;
  if(what==='potion'&&rw.potion){
    if(!addPotion(rw.potion)){toast('药水栏已满');return}rw.potion=null;
  }else if(what==='relic'&&rw.relic){gainRelic(rw.relic);rw.relic=null}
  else if(what==='choice'){gainRelic(rw.choices[idx]);rw.choices=null}

}

const net={ws:null,connected:false,id:null,room:'',host:null,members:{},started:false,config:null,chat:[],err:'',spectate:false,url:''};
function defaultWs(){
  if(location.protocol==='http:'||location.protocol==='https:')return (location.protocol==='https:'?'wss://':'ws://')+location.host;
  return 'ws://localhost:8787';
}
function myStatus(){
  if(!run)return{st:'未开局'};
  const rm=run.room,c=cb();
  const KN={monster:'小怪战',elite:'精英战',boss:'Boss 战',shop:'商店',rest:'休息处',treasure:'宝箱',event:'未知事件'};
  let st='地图';
  if(run.victory)st='已通关';else if(run.over)st='已倒下';else if(rm)st=KN[rm.kind]||'地图';
  return{d:run.difficulty,act:run.act,floor:run.pos?run.pos.r+1:0,hp:run.hp,max:run.maxHp,gold:run.gold,rel:run.relics.length,st,
    rem:(c&&c.started&&!c.done&&!run.over)?remainingMs(c):null,over:run.over,win:run.victory,wins:run.stats.wins};
}
let syncT=0;
function syncStatus(){
  if(!net.connected||!run||syncT)return;
  syncT=setTimeout(()=>{syncT=0;if(net.connected){const s=myStatus();net.members[net.id]&&(net.members[net.id].s=s,net.members[net.id].at=Date.now());netSend({t:'status',s});renderSide()}},250);
}
function netSend(o){if(net.ws&&net.ws.readyState===1)net.ws.send(JSON.stringify(o))}
function netConnect(url,room,name){
  net.err='';net.url=url;
  try{net.ws=new WebSocket(url)}catch(e){net.err='服务器地址无效';render();return}
  const ws=net.ws;
  ws.onopen=()=>netSend({t:'join',room,name});
  ws.onerror=()=>{net.err='无法连接服务器。请确认已运行 node server.js，并检查地址。';render()};
  ws.onclose=()=>{if(net.ws===ws){net.connected=false;net.members={};if(!net.err)net.err='连接已断开';render()}};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onNet(m)};
}
function netLeave(){if(net.ws){try{net.ws.close()}catch(e){}}net.ws=null;net.connected=false;net.members={};net.started=false;net.chat=[];net.err='';net.spectate=false;render()}
function setMembers(list){
  const old=net.members;net.members={};
  list.forEach(m=>{net.members[m.id]={name:m.name,s:m.s||(old[m.id]&&old[m.id].s)||null,at:Date.now()}});
}
function onNet(m){
  if(m.t==='joined'){
    net.connected=true;net.id=m.you;net.room=m.room;net.host=m.host;net.started=m.started;net.config=m.config;net.chat=[];net.spectate=false;
    setMembers(m.members);view='lobby';syncStatus();render();
  }else if(m.t==='members'){net.host=m.host;setMembers(m.members);renderSide();if(view==='lobby')render()}
  else if(m.t==='status'){if(net.members[m.id]){net.members[m.id].s=m.s;net.members[m.id].at=Date.now()}renderSide()}
  else if(m.t==='chat'){net.chat.push({n:m.name,x:m.text});if(net.chat.length>80)net.chat.shift();renderSide()}
  else if(m.t==='start'){
    net.started=true;net.config=m.config;
    if(m.config.difficulty>prog.unlocked){net.spectate=true;view='lobby';render();toast('你尚未解锁难度 '+m.config.difficulty+'，本局只能观战')}
    else{net.spectate=false;startRun(m.config.difficulty,m.config.seed);toast('对局开始，难度 '+m.config.difficulty+'，种子 '+m.config.seed)}
  }else if(m.t==='lobby'){net.started=false;if(view==='game'&&(run&&(run.over||run.victory)))view='lobby';render()}
  else if(m.t==='gift'){
    if(run&&!run.over&&!run.victory){const msg=givePotion(m.potion);toast(m.name+' 送来了「'+POTIONS[m.potion].n+'」。'+msg);save();render()}
  }else if(m.t==='error'){net.err=m.msg;toast(m.msg);if(!net.connected)render()}
}
function giftPotion(toId){
  const sel=document.getElementById('gift_'+toId);if(!sel||sel.value==='')return;
  const i=+sel.value,id=run.potions[i];if(!id)return;
  run.potions.splice(i,1);netSend({t:'gift',to:toId,potion:id});toast('已赠送「'+POTIONS[id].n+'」');save();render();
}

function withPreserve(fn){
  const vals={};let focus=null,ss=0,se=0;
  document.querySelectorAll('input[id],select[id]').forEach(e=>{vals[e.id]=e.value});
  const a=document.activeElement;
  if(a&&a.id&&(a.tagName==='INPUT'||a.tagName==='SELECT')){focus=a.id;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}}
  fn();
  for(const id in vals){const e=document.getElementById(id);if(e&&e.tagName!=='SELECT')e.value=vals[id];else if(e&&[...e.options].some(o=>o.value===vals[id]))e.value=vals[id]}
  if(focus){const e=document.getElementById(focus);if(e){e.focus();try{e.setSelectionRange(ss,se)}catch(x){}}}
}
function render(){
  withPreserve(()=>{
    const mw=document.getElementById('mapwrap');if(mw)mapScroll=mw.scrollTop;
    if(view==='menu')$app.innerHTML=menuHTML();

  }

}

function mapHTML(){
  const nodes=run.map.nodes,av=availNodes();
  const X=c=>60+c*96, Y=r=>50+(ROWS-r)*78;
  const jr=(r,c)=>{const g=rngFor(run.seed,'j'+run.act+'_'+r+'_'+c);return[(g()-0.5)*26,(g()-0.5)*22]};
  const pos={};
  for(let r=0;r<=ROWS;r++)for(let c=0;c<W;c++)if(nodes[r][c]){const j=r===ROWS?[0,0]:jr(r,c);pos[r+','+c]=[X(c)+j[0],Y(r)+j[1]]}
  let edges='',ns='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<W;c++){
    const n=nodes[r][c];if(!n)continue;
    for(const nc of n.next){
      const a=pos[r+','+c],b=pos[(r+1)+','+nc];
      const on=run.visited[r+','+c]&&(run.visited[(r+1)+','+nc]||(run.pos&&run.pos.r===r&&run.pos.c===c&&false));
      edges+=`<line class="edge ${on?'on':''}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
    }
  }
  for(let r=0;r<=ROWS;r++)for(let c=0;c<W;c++){
    const n=nodes[r][c];if(!n)continue;
    const p=pos[r+','+c],vis=run.visited[r+','+c],isAv=av.includes(n)&&!run.room,cur=run.pos&&run.pos.r===r&&run.pos.c===c;
    const col=`var(--c-${n.type})`,rad=n.type==='boss'?34:22;

      <title>${KIND_NAME[n.type]}</title>

      <text style="fill:${col};font-size:${n.type==='boss'?20:15}px">${KIND_GLYPH[n.type]}</text></g>`;
  }
  return `<svg viewBox="0 0 700 ${Y(0)+50}" role="img" aria-label="第 ${run.act} 阶段地图">${edges}${ns}</svg>`;
}

    }else body=`<div class="msg">${esc(rm.result)}</div><button class="primary" data-a="leave">继续</button>`;
  }
  return `<div class="modal-bg"><div class="modal"><h2>${title}</h2>${body}</div></div>`;
}

function tick(){
  if(run&&run.room&&run.room.combat&&run.room.phase==='fight'){
    const c=run.room.combat,rem=remainingMs(c);
    if(rem<=0&&!c.done){
      const rm=run.room, elapsed=Date.now()-c.startAt;
      const threshold=c.limitMs, interval=5*60000;
      const periods=Math.floor((elapsed-threshold)/interval);
      const applied=c.penaltyAt||0;
      if(periods>applied){
        const amount=rm.kind==='boss'?20:10;
        const loss=(periods-applied)*amount;
        c.penaltyAt=periods;run.hp=Math.max(0,run.hp-loss);
        toast('超时惩罚：损失 '+loss+' HP');
        if(run.hp<=0){run.over=true;c.done=true;rm.phase='lost';rm.reason='timeout';rm.lost=loss;save();render();return}
        save();render();return;
      }
    }
    const t=document.getElementById('cdTimer');
    if(t){t.textContent=rem>=0?fmtTime(rem):'+'+fmtTime(-rem);t.className='timer'+(rem<5*60000?' crit':rem<10*60000?' warn':'')}
    const b=document.getElementById('cdBar');if(b)b.style.width=Math.max(0,rem/(c.limitMs+c.extraMs)*100)+'%';
  }
  document.querySelectorAll('[data-end]').forEach(e=>{e.textContent=fmtTime(+e.dataset.end-Date.now())});
}

/* ---------- 洛谷离线随机跳题（参考用户提供的洛谷随机跳题插件） ---------- */
const LUOGU_DB='OI2LuoguOfflineDB', LUOGU_STORE='problems';
const LUOGU_DATA_URL='https://cdn.luogu.com.cn/problemset-open/latest.ndjson.gz';
let luoguDBPromise=null, luoguImportPromise=null;
function openLuoguDB(){
  if(luoguDBPromise)return luoguDBPromise;
  luoguDBPromise=new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(new Error('当前浏览器不支持 IndexedDB'));return}
    const req=indexedDB.open(LUOGU_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(LUOGU_STORE))db.createObjectStore(LUOGU_STORE,{keyPath:'pid'})};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('打开本地题库失败'));
  });
  return luoguDBPromise;
}
async function luoguProblemCount(){const db=await openLuoguDB();return new Promise((resolve,reject)=>{const tx=db.transaction(LUOGU_STORE,'readonly'),q=tx.objectStore(LUOGU_STORE).count();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function importLuoguProblems(){
  if(luoguImportPromise)return luoguImportPromise;
  luoguImportPromise=(async()=>{
    if(typeof window.pako==='undefined')throw new Error('压缩库加载失败，请检查网络后刷新页面');
    const status=document.getElementById('luoguPickStatus');if(status)status.textContent='正在下载洛谷离线题库（首次使用需要一些时间）…';
    const response=await fetch(LUOGU_DATA_URL,{mode:'cors',cache:'no-cache'});
    if(!response.ok)throw new Error('题库下载失败：HTTP '+response.status);
    const compressed=new Uint8Array(await response.arrayBuffer());
    const ndjson=window.pako.ungzip(compressed,{to:'string'});
    const lines=ndjson.split('\n');
    const db=await openLuoguDB();let batch=[];let imported=0;
    const writeBatch=()=>new Promise((resolve,reject)=>{
      if(!batch.length){resolve();return}
      const tx=db.transaction(LUOGU_STORE,'readwrite'),store=tx.objectStore(LUOGU_STORE);
      for(const item of batch)store.put(item);
      tx.oncomplete=()=>{imported+=batch.length;batch=[];if(status)status.textContent=`正在建立本地题库：${imported.toLocaleString()} 题`;resolve()};
      tx.onerror=()=>reject(tx.error||new Error('写入本地题库失败'));
    });
    for(let i=0;i<lines.length;i++){
      if(!lines[i])continue;
      try{const o=JSON.parse(lines[i]);if(o.pid&&Number.isFinite(Number(o.difficulty)))batch.push({pid:String(o.pid),title:String(o.title||''),difficulty:Number(o.difficulty),type:String(o.type||''),tags:Array.isArray(o.tags)?o.tags:[]})}catch(_){ }
      if(batch.length>=1200)await writeBatch();
    }
    await writeBatch();
    if(!imported)throw new Error('洛谷题库没有返回有效题目');
    return imported;
  })();
  try{return await luoguImportPromise}finally{luoguImportPromise=null}
}
function luoguDifficultyValues(hint){
  // 按游戏的推荐颜色映射洛谷公开题库 difficulty：黄=普及(3)，
  // 绿=普及+/提高-(4)，青=提高(5)，蓝=提高+/省选-(6)。
  const label=String(hint&&hint[0]||'');
  if(label.includes('难青 ~ 蓝'))return [5,6];
  if(label.includes('黄'))return [3];
  if(label.includes('绿'))return [4];
  if(label.includes('蓝'))return [6];
  if(label.includes('青'))return [5];
  return [];
}
function luoguTopicTags(topic){

    '动态规划':['动态规划 DP','背包 DP','数位 DP','区间 DP','树形 DP','轮廓线 DP','线性 DP','状压 DP','记忆化搜索','动态规划优化','斜率优化','状态合并','DP 套 DP','动态 DP','决策单调性','整体转移'],
    '图论':['图论','Kruskal 重构树','网络流','图论建模','图遍历','拓扑排序','最短路','生成树','最小环','负权环','连通块','2-SAT','强连通分量','Tarjan','双连通分量','欧拉回路','差分约束','仙人掌','二分图','一般图的最大匹配','上下界网络流','最小割','费用流','圆方树','Floyd 算法','广义串并联图','Hall 定理','基环树','虚树','树论','最大流最小割定理'],

    '贪心':['贪心','反悔贪心'],
    '搜索 / 剪枝':['搜索','广度优先搜索 BFS','深度优先搜索 DFS','剪枝','记忆化搜索','启发式搜索','迭代加深搜索','启发式迭代加深搜索 IDA*','Dancing Links','折半搜索 meet in the middle','A*  算法'],
    '构造':['构造','Ad-hoc','分类讨论'],
    '二分 / 三分':['二分','三分','整体二分'],
    '计算几何':['计算几何','三维计算几何','向量','凸包','叉积','线段相交','半平面交','旋转卡壳','极角排序','平面几何','闵可夫斯基和 Minkowski sum'],
    '模拟':['模拟','高精度'],
    '博弈论':['博弈论','博弈树','Nim 积','SG 函数']
  };
  return map[topic]||[];
}
function normalizeLuoguTag(value){return String(value||'').normalize('NFKC').toLowerCase().replace(/[\s　]+/g,'').replace(/[（）()]/g,'')}
function chooseLuoguProblem(problems,room){
  const difficulties=luoguDifficultyValues(room.hint);
  const wantedTags=luoguTopicTags(room.topic).map(normalizeLuoguTag);
  if(!difficulties.length||!wantedTags.length)return null;
  // 难度与算法必须同时满足；算法标签在推荐方向内 OR 匹配，不退回到无标签题。
  let pool=problems.filter(p=>difficulties.includes(Number(p.difficulty))&&(p.tags||[]).some(tag=>{
    const normalized=normalizeLuoguTag(typeof tag==='string'?tag:(tag&&tag.name)||tag);
    return wantedTags.some(w=>normalized===w||normalized.includes(w)||w.includes(normalized));
  }));
  // 符合推荐条件时优先主题库 P 题；没有 P 题才从其它题库类型中抽取。
  const main=pool.filter(p=>p.type==='P');if(main.length)pool=main;
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
async function randomLuoguJump(popup){
  const status=document.getElementById('luoguPickStatus');
  try{
    let count=await luoguProblemCount();
    if(!count){await importLuoguProblems();count=await luoguProblemCount()}
    if(status)status.textContent='正在从本地题库筛选…';
    const db=await openLuoguDB();
    const all=await new Promise((resolve,reject)=>{const tx=db.transaction(LUOGU_STORE,'readonly'),q=tx.objectStore(LUOGU_STORE).getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
    const problem=chooseLuoguProblem(all,run.room);
    if(!problem)throw new Error(`题库中暂时没有同时符合推荐难度（${(luoguDifficultyValues(run.room.hint)||[]).join('/')}）和算法「${run.room.topic}」的题目；没有擅自放宽筛选条件，请换一间战斗房或更新题库`);
    const url='https://www.luogu.com.cn/problem/'+encodeURIComponent(problem.pid);
    if(popup&&!popup.closed)popup.location.href=url;else window.open(url,'_blank','noopener');
    if(status)status.textContent=`已抽中：${problem.pid} · ${problem.title||'未命名题目'}（洛谷难度 ${problem.difficulty}，算法：${run.room.topic}）`;
    toast('已抽取洛谷题目：'+problem.pid);
  }catch(err){
    console.error('洛谷随机跳题失败',err);
    if(popup&&!popup.closed)popup.close();
    if(status)status.textContent='随机跳题失败：'+(err.message||'未知错误');
    toast('洛谷随机跳题失败，请检查网络或稍后重试');
  }
}

    case 'leaveNet':netLeave();break;
    case 'hostStart':{
      const dd=+document.getElementById('hostD').value,s=(document.getElementById('hostSeed').value||'').trim()||Math.random().toString(36).slice(2,8);
      netSend({t:'start',difficulty:dd,seed:s});break}
    case 'hostReset':netSend({t:'reset'});break;
    case 'joinRunning':if(net.config.difficulty>prog.unlocked){toast('你尚未解锁该难度')}else startRun(net.config.difficulty,net.config.seed);break;
    case 'chat':{const i=document.getElementById('chatIn');if(i&&i.value.trim()){netSend({t:'chat',text:i.value.trim()});i.value=''}break}
    case 'gift':giftPotion(d.to);break;
  }
});
$app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatIn'){e.preventDefault();const b=document.querySelector('[data-a="chat"]');if(b)b.click()}});
window.addEventListener('beforeunload',()=>{if(run)lsSet(LS_RUN,JSON.stringify(run))});
render();
</script>
</body>
</html>
